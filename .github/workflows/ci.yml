name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Format-valid placeholder so `next build` can run without real Clerk credentials.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_Y2kucGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA' }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'ci-placeholder-not-a-real-key' }}
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinora_test?schema=public
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinora_test?schema=public

jobs:
  quality:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  test:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check migrations match the schema
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinora_shadow
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE clinora_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - run: npm test

  e2e:
    name: End-to-end (Playwright)
    # Needs a real Clerk development instance: add NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY and
    # CLERK_SECRET_KEY as repository secrets, then set the repository variable RUN_E2E=true.
    if: ${{ vars.RUN_E2E == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
